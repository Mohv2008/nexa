name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync --workspace=@nexa/android
      - name: Restore release keystore
        shell: bash
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > apps/android/android/app/nexa-release.jks
      - name: Build signed APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          NEXA_KEYSTORE_PATH: nexa-release.jks
          NEXA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEXA_REQUIRE_SIGNING: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexa-android
          path: apps/android/android/app/build/outputs/apk/release/*.apk
      - name: Attach APK to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: apps/android/android/app/build/outputs/apk/release/*.apk

  windows:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-tauri-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
      - run: npm ci
      - name: Insert updater public key
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/tauri.conf.json'
          (Get-Content $path -Raw).Replace('REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY', '${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}') | Set-Content $path
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: NEXA ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
