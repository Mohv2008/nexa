[package]
name = "nexa-desktop"
version = "0.1.0"
description = "Lightweight NEXA desktop client"
authors = ["NEXA contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/nexa"

[lib]
name = "nexa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
